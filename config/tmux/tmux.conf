# ~/.tmux.conf
#
# Local-only theme: it needs a Nerd Font (Maple Mono NF, see the Brewfile).
# Everything else keeps the stock tmux keys, so a remote tmux feels the same.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -g history-limit 50000

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set -g escape-time 10

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------

# Keep the standard tmux prefix for compatibility with remote servers.
set -g prefix C-b

# Reload this file: prefix + r.
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane navigation
# ---------------------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Also keep the standard arrow-key navigation.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# ---------------------------------------------------------------------------
# Pane resizing
# ---------------------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Copy mode
# ---------------------------------------------------------------------------

setw -g mode-keys vi

# Vim-style selection: v starts, y copies (Space and Enter still work).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copies reach the Mac clipboard through OSC 52 (Ghostty allows clipboard
# writes), and programs inside tmux, like Vim over SSH, can set it too.
set -g set-clipboard on

# ---------------------------------------------------------------------------
# Appearance (gruvbox dark)
# ---------------------------------------------------------------------------

# bg0 #282828  bg1 #3c3836  bg2 #504945  fg #ebdbb2  gray #a89984
# green #b8bb26  yellow #fabd2f  orange #fe8019  aqua #8ec07c

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#ebdbb2,bg=#3c3836"

# Left: session name; turns orange while the prefix is active.
set -g status-left-length 30
set -g status-left "#[fg=#282828,bg=#{?client_prefix,#fe8019,#b8bb26},bold] #S #[fg=#{?client_prefix,#fe8019,#b8bb26},bg=#3c3836,nobold]"

# Windows: the current one is a yellow block, a Z marks a zoomed pane.
set -g window-status-separator ""
set -g window-status-style "fg=#a89984,bg=#3c3836"
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#3c3836,bg=#fabd2f]#[fg=#282828,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#fabd2f,bg=#3c3836,nobold]"

# Right: date and time, then the host (useful when sessions are nested).
set -g status-right-length 80
set -g status-right "#[fg=#504945,bg=#3c3836]#[fg=#ebdbb2,bg=#504945]  %Y-%m-%d   %H:%M #[fg=#b8bb26,bg=#504945]#[fg=#282828,bg=#b8bb26,bold]  #h "

set -g pane-border-status off
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26"

set -g message-style "fg=#282828,bg=#fabd2f"
set -g message-command-style "fg=#282828,bg=#fabd2f"
set -g mode-style "fg=#282828,bg=#fabd2f"

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------

set -g focus-events on

# Enable true color when supported.
set -as terminal-features ",xterm-256color:RGB"
