# ~/.config/starship.toml
#
# Gruvbox dark, one discreet rounded segment per module (tonal: bg1 pill,
# coloured text). Each segment draws its own caps, so it can appear or
# disappear without breaking its neighbours.
# Needs a Nerd Font (Maple Mono NF, see the Brewfile). Local macOS only:
# the Ubuntu servers keep the plain zsh prompt.

add_newline = true
palette = "gruvbox_dark"

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$docker_context\
$status\
$line_break\
$character"""

[palettes.gruvbox_dark]
# Pills share one background (bg1 here is gruvbox bg2, light enough to stay
# visible on a translucent terminal). Only the text is coloured, with the
# bright gruvbox accents.
bg1 = "#504945"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
aqua = "#8ec07c"
orange = "#fe8019"

# ---------------------------------------------------------------------------
# Directory
# ---------------------------------------------------------------------------

[directory]
format = "[](fg:bg1)[ $path$read_only ](fg:yellow bg:bg1)[](fg:bg1) "
# Keep the ~ visible for most paths, and mark a cut path with …/ so it is
# clear that parent directories are hidden.
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------

[git_branch]
format = "[](fg:bg1)[ $symbol$branch ](fg:green bg:bg1)[](fg:bg1) "
symbol = " "

[git_status]
# The outer ( ) hides the whole pill (caps included) when the repo is clean.
format = "([](fg:bg1)[ $all_status$ahead_behind ](fg:orange bg:bg1)[](fg:bg1) )"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ---------------------------------------------------------------------------
# Kubernetes
# ---------------------------------------------------------------------------

# Only shown in Kubernetes projects (not on every prompt).
[kubernetes]
disabled = false
format = "[](fg:bg1)[ 󱃾 $context( \\($namespace\\)) ](fg:blue bg:bg1)[](fg:bg1) "
detect_extensions = []
detect_files = [
    "kustomization.yaml",
    "kustomization.yml",
    "Chart.yaml",
    "helmfile.yaml",
    "helmfile.yml",
]
detect_folders = [
    ".kube",
    "k8s",
    "kubernetes",
    "helm",
    "charts",
]

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

[docker_context]
format = "[](fg:bg1)[ 󰡨 $context ](fg:aqua bg:bg1)[](fg:bg1) "
only_with_files = true
detect_files = [
    "docker-compose.yml",
    "docker-compose.yaml",
    "compose.yml",
    "compose.yaml",
    "Dockerfile",
]

# ---------------------------------------------------------------------------
# Command status
# ---------------------------------------------------------------------------

[status]
disabled = false
format = "[](fg:bg1)[ $symbol$status ](fg:red bg:bg1)[](fg:bg1) "
symbol = "✘ "
success_symbol = ""
recognize_signal_code = true

# ---------------------------------------------------------------------------
# Prompt character
# ---------------------------------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
