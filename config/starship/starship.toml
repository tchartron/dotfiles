# ~/.config/starship.toml

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$docker_context\
$status\
$character
"""

# ---------------------------------------------------------------------------
# Directory
# ---------------------------------------------------------------------------

[directory]
style = "bold"
truncation_length = 3
truncate_to_repo = false

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------

[git_branch]
format = " [$branch]($style)"
style = "bold"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ---------------------------------------------------------------------------
# Kubernetes
# ---------------------------------------------------------------------------

[kubernetes]
disabled = false
format = " ⎈ [$context]($style)[$namespace](dimmed green)"
style = "cyan"
detect_extensions = []
detect_files = [
    "kustomization.yaml",
    "kustomization.yml",
    "Chart.yaml",
    "helmfile.yaml",
    "helmfile.yml",
]
detect_folders = [
    ".kube",
    "k8s",
    "kubernetes",
    "helm",
    "charts",
]

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

[docker_context]
format = " 🐳 [$context]($style)"
style = "blue"
only_with_files = true
detect_files = [
    "docker-compose.yml",
    "docker-compose.yaml",
    "compose.yml",
    "compose.yaml",
    "Dockerfile",
]

# ---------------------------------------------------------------------------
# Command status
# ---------------------------------------------------------------------------

[status]
disabled = false
format = " [$status]($style)"
style = "bold red"
symbol = "✘ "
success_symbol = ""
recognize_signal_code = true

# ---------------------------------------------------------------------------
# Prompt character
# ---------------------------------------------------------------------------

[character]
success_symbol = " ❯"
error_symbol = " ❯"
vimcmd_symbol = " ❮"
