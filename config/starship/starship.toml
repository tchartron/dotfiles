# ~/.config/starship.toml
#
# Gruvbox dark, one rounded segment per module. Each segment draws its own
# caps, so it can appear or disappear without breaking its neighbours.
# Needs a Nerd Font (Maple Mono NF, see the Brewfile). Local macOS only:
# the Ubuntu servers keep the plain zsh prompt.

add_newline = true
palette = "gruvbox_dark"

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$docker_context\
$status\
$line_break\
$character"""

[palettes.gruvbox_dark]
bg0 = "#282828"
fg1 = "#ebdbb2"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
aqua = "#689d6a"
orange = "#d65d0e"

# ---------------------------------------------------------------------------
# Directory
# ---------------------------------------------------------------------------

[directory]
format = "[](fg:yellow)[ $path$read_only ](fg:bg0 bg:yellow bold)[](fg:yellow) "
# Keep the ~ visible for most paths, and mark a cut path with …/ so it is
# clear that parent directories are hidden.
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------

[git_branch]
format = "[](fg:green)[ $symbol$branch ](fg:bg0 bg:green bold)[](fg:green) "
symbol = " "

[git_status]
# The outer ( ) hides the whole pill (caps included) when the repo is clean.
format = "([](fg:orange)[ $all_status$ahead_behind ](fg:bg0 bg:orange bold)[](fg:orange) )"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ---------------------------------------------------------------------------
# Kubernetes
# ---------------------------------------------------------------------------

# Only shown in Kubernetes projects (not on every prompt).
[kubernetes]
disabled = false
format = "[](fg:blue)[ 󱃾 $context( \\($namespace\\)) ](fg:fg1 bg:blue bold)[](fg:blue) "
detect_extensions = []
detect_files = [
    "kustomization.yaml",
    "kustomization.yml",
    "Chart.yaml",
    "helmfile.yaml",
    "helmfile.yml",
]
detect_folders = [
    ".kube",
    "k8s",
    "kubernetes",
    "helm",
    "charts",
]

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

[docker_context]
format = "[](fg:aqua)[ 󰡨 $context ](fg:bg0 bg:aqua bold)[](fg:aqua) "
only_with_files = true
detect_files = [
    "docker-compose.yml",
    "docker-compose.yaml",
    "compose.yml",
    "compose.yaml",
    "Dockerfile",
]

# ---------------------------------------------------------------------------
# Command status
# ---------------------------------------------------------------------------

[status]
disabled = false
format = "[](fg:red)[ $symbol$status ](fg:fg1 bg:red bold)[](fg:red) "
symbol = "✘ "
success_symbol = ""
recognize_signal_code = true

# ---------------------------------------------------------------------------
# Prompt character
# ---------------------------------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
